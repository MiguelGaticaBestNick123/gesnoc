name: CI

# La aplicación vive en desarrollo/; Fase 2/ y las demás entregas no necesitan verificación.
on:
  push:
    branches: [main]
    paths:
      - 'desarrollo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'desarrollo/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: desarrollo

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gesnoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gesnoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Claves de una base desechable que solo existe durante la ejecución.
    env:
      CLAVE_POSTGRES: postgres
      DATABASE_URL: postgres://gesnoc_app:app_ci@localhost:5432/gesnoc
      DATABASE_URL_MIGRADOR: postgres://gesnoc_migrador:migrador_ci@localhost:5432/gesnoc?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desarrollo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Crear roles de la base
        run: >-
          psql "postgres://postgres:postgres@localhost:5432/gesnoc" -v ON_ERROR_STOP=1
          -v clave_migrador=migrador_ci -v clave_app=app_ci -f db/roles.sql

      - name: Aplicar migraciones
        run: npm run db:migrar

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias y de integración
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: desarrollo/playwright-report/
          retention-days: 7
